
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            color: #333;
            background: #fff;
        }

        h2 {
            color: #7600bc;
            font-size: 28px;
        }

        #recommendation-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 25px 0;
        }

        .recommendation {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            min-height: 80px;
            box-shadow: 0 3px 8px #00000012;
            font-style: italic;
        }

        form {
            margin-top: 35px;
            max-width: 450px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        button {
            margin-top: 12px;
            padding: 12px 25px;
            background: #7600bc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #58008c;
        }
    </style>
</head>
<body>

    <h2>Recommendations</h2>

    <p>Here are some recommendations from colleagues:</p>

    <div id="recommendation-list">
        <div class="recommendation">
            "A dedicated learner with excellent problem-solving skills."
        </div>

        <div class="recommendation">
            "Shows enthusiasm for technology and continuous improvement."
        </div>

        <div class="recommendation">
            "Works consistently toward building useful projects."
        </div>
    </div>

    <form id="recommendation-form">
        <h3>Add a Recommendation</h3>

        <textarea
            id="recommendation-text"
            rows="4"
            placeholder="Write your recommendation here..."
            required
        ></textarea>

        <br>
        <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
